<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixelforge UI lab</title>
<style>
  :root{--bg:#121417;--bar:#181B1F;--panel:#1E2227;--line:#2A2F36;--fg:#E7E9EC;--dim:#8B93A0;--accent:#7AA2F7}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header{background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px 0}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .title{font-weight:700;letter-spacing:.01em}
  .title span{color:var(--dim);font-weight:400;margin-left:6px}
  .hint{margin-left:auto;color:var(--dim);font-size:12px}
  kbd{font:11px ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--fg)}
  [role=tablist]{display:flex;gap:2px;overflow-x:auto}
  [role=tab]{font:inherit;color:var(--dim);background:transparent;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
  [role=tab]:hover{color:var(--fg);background:rgba(255,255,255,.03)}
  [role=tab][aria-selected=true]{color:var(--fg);background:var(--bg);border-color:var(--line);position:relative;top:1px}
  [role=tab] .k{font:600 11px ui-monospace,monospace;background:var(--panel);border-radius:4px;padding:1px 6px;color:var(--dim)}
  [role=tab][aria-selected=true] .k{background:var(--accent);color:#0E1116}
  .info{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
  .info p{margin:0;color:var(--dim);font-size:13px;flex:1 1 420px}
  .info b{color:var(--fg);font-weight:600}
  .chip{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
  .sel{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#2E4A2F;color:#B9E3B5;border-radius:99px;padding:1px 7px}
  .chip.chosen{border-color:#3E6B40;color:#B9E3B5;background:#1D2B1E}
  .info a{color:var(--accent);font-size:13px;text-decoration:none;white-space:nowrap}
  .info a:hover{text-decoration:underline}
  .stage{flex:1;min-height:0;padding:12px;background:var(--bg)}
  iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
  .tips{color:var(--dim);font-size:12px;padding:0 16px 10px;background:var(--bg)}
  @media (max-width:700px){.hint{display:none}.info{flex-wrap:wrap}}
</style>
</head>
<body>
<header>
  <div class="top"><span class="title">Pixelforge UI lab<span>design exploration · fake data · selected: D · Feed with the Sidebar layout</span></span>
    <span class="hint">Switch with <kbd>1</kbd>–<kbd>5</kbd> or <kbd>←</kbd> <kbd>→</kbd></span></div>
  <div role="tablist" aria-label="Design versions" id="tabs"></div>
</header>
<div class="info" id="info"></div>
<div class="tips">Try: type in the prompt and watch the price · switch quality · tick “Lab: simulate low balance” · hover dotted amounts for exact values · check failed, capped and expired items</div>
<main class="stage"><iframe id="frame" title="Selected design version"></iframe></main>
<script>
const V=[
  {id:"a",name:"Proof sheet",path:"a-proof-sheet/",skill:"frontend-design",layout:"Own layout",desc:"Print-shop proof: cool paper, navy ink, CMY colours only as signals. Cost meter split by what drives the price; history as a contact sheet."},
  {id:"b",name:"Document",path:"b-document/",skill:"minimalist-ui",layout:"Own layout",desc:"Warm monochrome, serif headings, pastel tags. The estimate is an itemised receipt; history is a quiet list."},
  {id:"c",name:"Telemetry",path:"c-telemetry/",skill:"industrial-brutalist-ui",layout:"Own layout",desc:"Dark terminal, huge type, hazard red. A gauge splits “known now” from “depends on result”; history is a dense log."},
  {id:"d",name:"Feed",path:"d-feed-minimal/?layout=1",selected:"Selected · Sidebar layout for Credits and Admin report",skill:"minimalist-ui",layout:"Higgsfield-style layout · B's look",desc:"Create and history on one screen: masonry feed, floating prompt bar with a price chip that opens the receipt, side panel per image."},
  {id:"e",name:"Studio",path:"e-studio-proof/",skill:"frontend-design",layout:"OpenArt-style layout · A's look",desc:"Settings panel with the cost meter and Generate pinned at its foot; results on the right, one row per prompt."},
];
const tabs=document.getElementById("tabs"),frame=document.getElementById("frame"),info=document.getElementById("info");
tabs.innerHTML=V.map((v,i)=>`<button role="tab" id="tab-${v.id}" aria-controls="frame" data-i="${i}" tabindex="-1"><span class="k">${v.id.toUpperCase()}</span>${v.name}${v.selected?'<span class="sel">Selected</span>':""}</button>`).join("");
function select(i,focus){
  i=(i+V.length)%V.length; const v=V[i];
  tabs.querySelectorAll("[role=tab]").forEach((t,j)=>{t.setAttribute("aria-selected",j===i);t.tabIndex=j===i?0:-1});
  if(focus) tabs.children[i].focus();
  if(frame.getAttribute("src")!==v.path) frame.src=v.path;
  info.innerHTML=`<p><b>${v.id.toUpperCase()} · ${v.name}.</b> ${v.desc}</p>${v.selected?`<span class="chip chosen">✓ ${v.selected}</span>`:""}<span class="chip">Skill: ${v.skill}</span><span class="chip">${v.layout}</span><a href="${v.path}" target="_blank" rel="noopener">Open full page ↗</a>`;
  history.replaceState(null,"","#"+v.id); cur=i;
}
let cur=0;
tabs.addEventListener("click",e=>{const t=e.target.closest("[role=tab]");if(t)select(+t.dataset.i)});
tabs.addEventListener("keydown",e=>{if(e.key==="ArrowRight")select(cur+1,true);if(e.key==="ArrowLeft")select(cur-1,true)});
addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;const n=+e.key;if(n>=1&&n<=V.length)select(n-1,true)});
const start=V.findIndex(v=>"#"+v.id===location.hash);select(start<0?V.findIndex(v=>v.selected):start);
</script>
</body>
</html>
