<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab B · Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Direction: "Document" (minimalist-ui skill). Warm monochrome, editorial serif headings,
  1px #EAEAEA structure, muted pastel status tags. The estimate reads like an itemised receipt.
  History is a quiet list, not a grid.
-->
<style>
  :root{--bg:#FBFBFA;--card:#FFFFFF;--ink:#2F3437;--mute:#787774;--line:#EAEAEA;--btn:#111111;
    --red-bg:#FDEBEC;--red:#9F2F2D;--blue-bg:#E1F3FE;--blue:#1F6C9F;--green-bg:#EDF3EC;--green:#346538;--yellow-bg:#FBF3DB;--yellow:#956400;
    --serif:"Newsreader",Georgia,serif;--sans:"Geist","Helvetica Neue",sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(800px 400px at 80% -10%,rgba(214,180,120,.06),transparent)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  header{position:sticky;top:0;z-index:5;background:rgba(251,251,250,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{max-width:1040px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:28px}
  .logo{font-family:var(--serif);font-size:20px;letter-spacing:-.02em}
  nav{display:flex;gap:4px}
  nav a{color:var(--mute);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}
  nav a[aria-current]{color:var(--ink);background:#F1F0EC}
  .bal{margin-left:auto;font-size:13px;color:var(--mute)}
  .bal b{font-family:var(--mono);color:var(--ink);font-weight:500}
  main{max-width:1040px;margin:0 auto;padding:64px 28px 120px}
  h1{font-family:var(--serif);font-weight:400;font-size:48px;letter-spacing:-.03em;line-height:1.1;margin:0 0 10px}
  h2{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:-.02em;margin:0 0 16px}
  .lede{color:var(--mute);margin:0 0 48px;max-width:560px}
  .money{font-family:var(--mono);border-bottom:1px dotted #C8C6C0;cursor:help}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .btn{font:inherit;font-weight:500;background:var(--btn);color:#fff;border:0;border-radius:6px;padding:11px 18px;cursor:pointer}
  .btn:hover{background:#333}.btn:active{transform:scale(.98)}
  .btn[disabled]{background:#CFCDC8;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:9999px}
  .t-gray{background:#F1F0EC;color:var(--mute)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-yellow{background:var(--yellow-bg);color:var(--yellow)}
  .t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}
  .reveal{opacity:0;transform:translateY(12px);animation:in .6s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i,0)*70ms)}
  @keyframes in{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}}
  /* generate */
  .gen{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
  .pad{padding:32px}
  textarea{width:100%;border:0;font:22px/1.45 var(--serif);color:var(--ink);resize:vertical;min-height:140px;background:transparent;padding:0;letter-spacing:-.01em}
  textarea:focus{outline:none}
  .count{font:12px var(--mono);color:var(--mute);text-align:right;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}
  .lbl{font-size:12px;color:var(--mute);margin-bottom:8px}
  .choice{display:flex;flex-direction:column;gap:4px}
  .choice button{font:inherit;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--mute);display:flex;justify-content:space-between}
  .choice button[aria-pressed=true]{border-color:var(--line);background:#F7F6F3;color:var(--ink)}
  .choice small{font-family:var(--mono);font-size:11px}
  .refs{margin-top:28px}
  .refs input{width:100%;font:13px var(--mono);border:0;border-bottom:1px solid var(--line);padding:8px 0;background:transparent;color:var(--ink)}
  .refrow{display:flex;gap:10px;align-items:center}
  .x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px}
  .add{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:13px;padding:8px 0}
  /* SIGNATURE: receipt */
  .receipt{padding:32px;font-size:14px}
  .receipt .total{font-family:var(--serif);font-size:40px;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px}
  .receipt .total span{color:var(--mute)}
  .lines{margin:24px 0 0;border-top:1px solid var(--line)}
  .line{display:grid;grid-template-columns:1fr auto;padding:12px 0;border-bottom:1px solid var(--line)}
  .line small{display:block;color:var(--mute);font-family:var(--mono);font-size:11px}
  .line .v{font-family:var(--mono);font-size:13px;text-align:right}
  .line.sum .v{font-weight:500}
  .note{font-size:13px;color:var(--mute);margin-top:16px}
  .afford{margin-top:20px;padding:12px 14px;border-radius:8px;font-size:13px}
  .lab{font-size:12px;color:var(--mute);margin-top:12px;display:flex;gap:6px;align-items:center}
  .submit{display:flex;gap:16px;align-items:center;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
  /* history list */
  .list{border-top:1px solid var(--line)}
  .row{display:grid;grid-template-columns:112px 1fr 220px;gap:24px;padding:22px 0;border-bottom:1px solid var(--line);align-items:start}
  .thumb{width:112px;aspect-ratio:1;border-radius:8px;background:#F1F0EC;overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:11px;text-align:center;padding:6px}
  .thumb img{width:100%;height:100%;object-fit:cover;padding:0;filter:saturate(.75)}
  .thumb.live{background:linear-gradient(90deg,#F1F0EC 0,#F7F6F3 50%,#F1F0EC 100%);background-size:200% 100%;animation:sh 1.6s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.thumb.live{animation:none}}
  .row h3{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.01em;margin:6px 0 4px;line-height:1.25}
  .meta{font-size:12px;color:var(--mute)}
  .why{margin-top:10px;font-size:13px;color:var(--red);background:var(--red-bg);border-radius:6px;padding:8px 10px}
  .why b{font-weight:600}
  .cost{text-align:right;font-size:13px}
  .cost .big{font-family:var(--mono);font-size:18px;color:var(--ink)}
  .track{height:4px;background:#F1F0EC;border-radius:2px;position:relative;margin:10px 0 6px}
  .track i{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink)}
  .pager{display:flex;justify-content:space-between;margin-top:24px;font-size:13px;color:var(--mute)}
  /* credits bento */
  .bento{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto auto;gap:16px}
  .bento .wide{grid-row:span 2}
  .huge{font-family:var(--serif);font-size:64px;letter-spacing:-.04em;line-height:1}
  .pk{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
  .pk:last-child{border:0}
  .pk b{font-family:var(--serif);font-weight:400;font-size:24px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:12px 14px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .n{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
  .section{margin-top:72px}
  .controls{display:flex;gap:12px;align-items:center;margin-bottom:20px;font-size:13px;color:var(--mute)}
  .controls input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{padding:20px}.stat .v{font-family:var(--serif);font-size:30px;letter-spacing:-.03em}
  @media (max-width:860px){.gen,.bento,.stats{grid-template-columns:1fr}.row{grid-template-columns:80px 1fr}.row .cost{grid-column:2;text-align:left}.thumb{width:80px}h1{font-size:36px}nav{overflow:auto}}
</style>
</head>
<body>
<header><div class="bar"><span class="logo">Pixelforge</span><nav id="nav"></nav><span class="bal" id="bal"></span></div></header>
<main id="main"></main>
<script src="../mock-data.js"></script>
<script>
const L=window.LAB;
const m=(n,d)=>`<span class="money" title="${L.exact(n)}">${L.cents(n,d)}</span>`;
const TAG={waiting:["Waiting for a slot","t-gray"],queued:["Queued","t-blue"],processing:["Processing","t-yellow"],succeeded:["Done","t-green"],failed:["Failed","t-red"]};
const S={prompt:"A lighthouse on a cliff at dawn, oil painting",size:"1536x1024",quality:"high",refs:["https://example.com/style.png"],low:false};

function chrome(page){
  document.getElementById("nav").innerHTML=[["generate","Generate"],["history","History"],["credits","Credits"],["admin","Report"]].map(([k,t])=>`<a href="#${k}" ${k===page?'aria-current="page"':""}>${t}</a>`).join("");
  document.getElementById("bal").innerHTML=`Available <b title="${L.exact(L.available)}">${L.cents(L.available)}</b>`;
}

function generate(){
  const e=L.estimate(S.prompt,S.size,S.quality,S.refs.filter(Boolean).length);
  const avail=S.low?120_000_000:L.available, ok=avail>=e.highNano&&S.prompt.trim();
  const up=(n)=>Math.ceil(n*1.25), dn=(n)=>Math.floor(n*1.25);
  return `<h1 class="reveal">What should we make?</h1><p class="lede reveal" style="--i:1">You'll see the price range before anything runs. Failed images are free.</p>
  <div class="gen">
    <form class="card pad reveal" style="--i:2" onsubmit="event.preventDefault()">
      <label class="lbl" for="p">Prompt</label>
      <textarea id="p" maxlength="4000">${S.prompt}</textarea>
      <div class="count">${[...S.prompt].length} / 4,000</div>
      <div class="opts">
        <div><div class="lbl">Size</div><div class="choice">${[["1024x1024","Square"],["1536x1024","Landscape"],["1024x1536","Portrait"]].map(([v,t])=>`<button type="button" data-size="${v}" aria-pressed="${S.size===v}">${t}<small>${v}</small></button>`).join("")}</div></div>
        <div><div class="lbl">Quality</div><div class="choice">${["low","medium","high"].map(q=>`<button type="button" data-q="${q}" aria-pressed="${S.quality===q}">${q[0].toUpperCase()+q.slice(1)}</button>`).join("")}</div></div>
      </div>
      <div class="refs"><div class="lbl">Reference images · optional, up to 4</div>
        ${S.refs.map((r,i)=>`<div class="refrow"><input type="url" data-ref="${i}" value="${r}" placeholder="https://"><button type="button" class="x" data-rm="${i}" aria-label="Remove reference">×</button></div>`).join("")}
        ${S.refs.length<4?'<button type="button" class="add" id="add">Add a reference URL</button>':""}</div>
      <div class="submit"><button class="btn" ${ok?"":"disabled"}>Generate</button><span class="meta">Up to ${m(e.highNano,"up")}</span></div>
    </form>
    <aside class="card receipt reveal" style="--i:3" aria-live="polite">
      <div class="lbl">Estimated price</div>
      <div class="total">${L.cents(e.lowNano,"down")} <span>to</span> ${L.cents(e.highNano,"up")}</div>
      <div class="meta">Never more than ${m(e.highNano,"up")}</div>
      <div class="lines">
        ${e.breakdown.map(b=>`<div class="line"><div>${b.label}<small>${b.tokens} tokens · ${b.note}</small></div><div class="v">${b.low===b.high?L.cents(up(b.low)):L.cents(dn(b.low),"down")+" – "+L.cents(up(b.high),"up")}</div></div>`).join("")}
        <div class="line sum"><div>Includes 25% service fee</div><div class="v">${L.cents(e.lowNano,"down")} – ${L.cents(e.highNano,"up")}</div></div>
      </div>
      <p class="note">Prompt length and thinking time are only known once the image is done. You're charged the exact amount then.</p>
      <div class="afford" style="background:${ok?"var(--green-bg)":"var(--red-bg)"};color:${ok?"var(--green)":"var(--red)"}">${ok?`${m(avail)} available`:`Not enough credits: ${m(avail)} available, this could cost up to ${m(e.highNano,"up")}. <a href="#credits" style="color:inherit">Buy credits</a>`}</div>
      <label class="lab"><input type="checkbox" id="low" ${S.low?"checked":""}> Lab: simulate low balance</label>
    </aside>
  </div>`;
}

function history(){
  const rows=L.generations.map((g,i)=>{
    const [t,c]=TAG[g.status];
    let thumb=g.status==="succeeded"&&g.image?`<img src="${g.image}" alt="">`:g.status==="succeeded"?"Image expired":g.status==="failed"?"No image":"";
    const live=["waiting","queued","processing"].includes(g.status);
    const err=g.status==="failed"?`<div class="why"><b>${L.ERRORS[g.error.code].title}.</b> ${L.ERRORS[g.error.code].body}</div><div style="margin-top:10px"><button class="btn ghost">Try again</button></div>`:"";
    const sub=g.status==="waiting"?"Pixelforge is busy. We'll keep trying for up to 10 minutes.":g.status==="queued"?"Accepted by Pixelforge, waiting to start.":g.status==="processing"?"Drawing now. Usually 5 to 30 seconds.":"";
    const pos=L.rangePos(g);
    const cost=g.status==="succeeded"?`<div class="big">${m(g.actual)}</div><div class="track" title="Where the charge landed in the estimate"><i style="left:${Math.min(100,pos*100)}%"></i></div><div class="meta">Estimate ${L.cents(g.estLow,"down")}–${L.cents(g.estHigh,"up")}${g.capped?' · <span class="tag t-red" title="Pixelforge raised prices after you submitted; we charged the max you were shown.">capped</span>':""}</div>`
      :g.status==="failed"?`<div class="big">$0.00</div><div class="meta">Not charged</div>`
      :`<div class="big" style="color:var(--mute)">≤ ${L.cents(g.estHigh,"up")}</div><div class="meta">Estimate ${L.cents(g.estLow,"down")}–${L.cents(g.estHigh,"up")}</div>`;
    return `<div class="row reveal" style="--i:${i}"><div class="thumb ${live?"live":""}">${thumb}</div>
      <div><span class="tag ${c}">${t}</span><h3>${g.prompt}</h3><div class="meta">${g.size} · ${g.quality}${g.refs.length?` · ${g.refs.length} ref`:""} · ${new Date(g.createdAt).toLocaleString()}</div>${sub?`<div class="meta" style="margin-top:6px">${sub}</div>`:""}${err}</div>
      <div class="cost">${cost}</div></div>`;
  }).join("");
  return `<h1>History</h1><p class="lede">Newest first. This page refreshes itself while anything is still running.</p><div class="list">${rows}</div>
  <div class="pager"><span>1–11 of 11</span><span>Page 1 of 1</span></div>`;
}

function credits(){
  return `<h1>Credits</h1><p class="lede">Credits are US dollars. Your balance only goes down when an image succeeds.</p>
  <div class="bento">
    <div class="card pad wide"><div class="lbl">Available to spend</div><div class="huge">${m(L.available)}</div>
      <div class="lines" style="margin-top:32px">
        <div class="line"><div>Balance</div><div class="v">${m(L.balance)}</div></div>
        <div class="line"><div>Set aside for ${L.inProgress.length} images in progress<small>their maximum price, released when they finish</small></div><div class="v">− ${m(L.held)}</div></div>
        <div class="line sum"><div>Available</div><div class="v">${m(L.available)}</div></div></div></div>
    <div class="card pad"><div class="lbl">Add credits</div>${L.packs.map(p=>`<div class="pk"><b>$${p}</b><button class="btn ghost">Add</button></div>`).join("")}<div class="meta" style="margin-top:8px">No payment needed. This is a demo.</div></div>
    <div class="card pad"><div class="lbl">Starting bonus</div><div style="font-family:var(--serif);font-size:24px">$5.00</div><div class="meta">Added when you signed up.</div></div>
  </div>
  <div class="section"><h2>Ledger</h2><div class="card"><table><thead><tr><th>Date</th><th>Entry</th><th class="n">Amount</th></tr></thead><tbody>
  ${L.ledger.map(e=>`<tr><td class="meta">${new Date(e.at).toLocaleString()}</td><td>${e.reason}${e.gen?`<div class="meta">${L.generations.find(g=>g.id===e.gen).prompt}</div>`:""}</td><td class="n" title="${L.exact(e.amount)}" style="color:${e.amount>0?"var(--green)":"var(--ink)"}">${e.amount>0?"+":"−"}${L.cents(Math.abs(e.amount))}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

function admin(){
  const T=L.days.reduce((a,d)=>({c:a.c+d.charged,p:a.p+d.provider,g:a.g+d.gens,cap:a.cap+d.cappedCount}),{c:0,p:0,g:0,cap:0});
  const mis=L.days.filter(d=>d.provider!==d.pixelforge).length;
  return `<h1>Report</h1><p class="lede">UTC days, by when each image finished. Pixelforge bills the same way, so the columns should match to the nanodollar.</p>
  <div class="controls"><input type="date" value="${L.days.at(-1).date}"> – <input type="date" value="${L.days[0].date}"><span>Up to 92 days</span></div>
  <div class="stats"><div class="card stat"><div class="lbl">Charged</div><div class="v">${L.cents(T.c)}</div></div><div class="card stat"><div class="lbl">Pixelforge cost</div><div class="v">${L.cents(T.p)}</div></div>
    <div class="card stat"><div class="lbl">Profit</div><div class="v">${L.cents(T.c-T.p)}</div></div><div class="card stat"><div class="lbl">Reconciled</div><div class="v">${L.days.length-mis}/${L.days.length}</div><span class="tag ${mis?"t-yellow":"t-green"}">${mis?mis+" day off":"all match"}</span></div></div>
  <div class="card"><table><thead><tr><th>Day</th><th class="n">Images</th><th class="n">Charged</th><th class="n">Pixelforge cost</th><th class="n">Pixelforge reports</th><th class="n">Profit</th><th class="n">Estimated</th><th></th></tr></thead><tbody>
  ${L.days.map(d=>`<tr><td><a href="#admin">${d.date}</a></td><td class="n">${d.gens}</td><td class="n">${L.exact(d.charged)}</td><td class="n">${L.exact(d.provider)}</td><td class="n">${L.exact(d.pixelforge)}</td><td class="n">${L.exact(d.profit)}</td><td class="n">${L.cents(d.estLow,"down")}–${L.cents(d.estHigh,"up")}</td>
    <td>${d.provider===d.pixelforge?'<span class="tag t-green">match</span>':`<span class="tag t-yellow" title="Off by ${L.exact(d.pixelforge-d.provider)}">mismatch</span>`} ${d.cappedCount?`<span class="tag t-red" title="${L.exact(d.absorbed)} absorbed">${d.cappedCount} capped</span>`:""}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="section"><h2>By user</h2><div class="card"><table><thead><tr><th>User</th><th class="n">Images</th><th class="n">Charged</th><th class="n">Pixelforge cost</th><th class="n">Profit</th><th class="n">Estimated</th><th></th></tr></thead><tbody>
  ${L.users.map(u=>`<tr><td>${u.name}<div class="meta">${u.email}</div></td><td class="n">${u.gens}</td><td class="n">${L.exact(u.charged)}</td><td class="n">${L.exact(u.provider)}</td><td class="n">${L.exact(u.profit)}</td><td class="n">${L.cents(u.estLow,"down")}–${L.cents(u.estHigh,"up")}</td><td>${u.cappedCount?`<span class="tag t-red">${u.cappedCount} capped</span>`:""}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="section"><h2>${L.days[0].date}, image by image</h2><div class="card"><table><thead><tr><th>Prompt</th><th class="n">Estimate</th><th style="width:180px">Landed at</th><th class="n">Charged</th><th class="n">Pixelforge cost</th></tr></thead><tbody>
  ${L.generations.filter(g=>g.status==="succeeded").map(g=>`<tr><td>${g.prompt}${g.capped?' <span class="tag t-red">capped</span>':""}</td><td class="n">${L.cents(g.estLow,"down")}–${L.cents(g.estHigh,"up")}</td><td><div class="track"><i style="left:${Math.min(100,L.rangePos(g)*100)}%"></i></div><span class="meta">${Math.round(Math.min(1,L.rangePos(g))*100)}% of range</span></td><td class="n">${L.exact(g.actual)}</td><td class="n">${L.exact(g.provider)}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

function render(){
  const page=(location.hash||"#generate").slice(1); chrome(page);
  document.getElementById("main").innerHTML=({generate,history,credits,admin}[page]||generate)();
  if(page!=="generate")return;
  const p=document.getElementById("p");
  p.oninput=()=>{S.prompt=p.value;const c=p.selectionStart;render();const n=document.getElementById("p");n.focus();n.setSelectionRange(c,c);document.querySelectorAll(".reveal").forEach(x=>x.style.animation="none"),document.querySelectorAll(".reveal").forEach(x=>{x.style.opacity=1;x.style.transform="none"})};
  document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{S.size=b.dataset.size;render()});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.quality=b.dataset.q;render()});
  document.querySelectorAll("[data-ref]").forEach(i=>i.onchange=()=>{S.refs[+i.dataset.ref]=i.value;render()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.refs.splice(+b.dataset.rm,1);render()});
  const a=document.getElementById("add");if(a)a.onclick=()=>{S.refs.push("");render()};
  document.getElementById("low").onchange=e=>{S.low=e.target.checked;render()};
}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
