<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab D · Feed (minimal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  Layout pattern: generation-platform "feed + floating composer" (Higgsfield-style): Create and History
  are one screen. Results fill a masonry feed; the prompt bar floats at the bottom with setting chips
  and a live price chip. Clicking a result opens a side panel with its cost story.
  Look: minimalist-ui (same tokens as B): warm monochrome, serif display, 1px #EAEAEA, pastel tags.
-->
<style>
  :root{--bg:#FBFBFA;--card:#FFF;--ink:#2F3437;--mute:#787774;--line:#EAEAEA;--btn:#111;
    --red-bg:#FDEBEC;--red:#9F2F2D;--blue-bg:#E1F3FE;--blue:#1F6C9F;--green-bg:#EDF3EC;--green:#346538;--yellow-bg:#FBF3DB;--yellow:#956400;
    --serif:"Newsreader",Georgia,serif;--sans:"Geist","Helvetica Neue",sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  header{position:sticky;top:0;z-index:20;background:rgba(251,251,250,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{padding:12px 28px;display:flex;align-items:center;gap:24px}
  .logo{font-family:var(--serif);font-size:20px;letter-spacing:-.02em}
  nav{display:flex;gap:4px}
  nav a{color:var(--mute);text-decoration:none;padding:6px 10px;border-radius:6px}
  nav a[aria-current]{color:var(--ink);background:#F1F0EC}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer;white-space:nowrap}
  .chip small{color:var(--mute);font-family:var(--mono);font-size:11px}
  .chip[aria-expanded=true]{border-color:#CFCDC8;background:#F7F6F3}
  .wallet{margin-left:auto}
  .wallet b{font-family:var(--mono);font-weight:500}
  .money{font-family:var(--mono);border-bottom:1px dotted #C8C6C0;cursor:help}
  .tag{display:inline-block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:9999px}
  .t-gray{background:#F1F0EC;color:var(--mute)}.t-blue{background:var(--blue-bg);color:var(--blue)}.t-yellow{background:var(--yellow-bg);color:var(--yellow)}.t-green{background:var(--green-bg);color:var(--green)}.t-red{background:var(--red-bg);color:var(--red)}
  .btn{font:inherit;font-weight:500;background:var(--btn);color:#fff;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#333}.btn:active{transform:scale(.98)}.btn[disabled]{background:#CFCDC8;cursor:not-allowed}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  /* feed */
  .intro{padding:40px 28px 8px;display:flex;align-items:end;justify-content:space-between;gap:20px}
  h1{font-family:var(--serif);font-weight:400;font-size:40px;letter-spacing:-.03em;line-height:1.1;margin:0}
  .filters{display:flex;gap:6px}
  .feed{columns:4 260px;column-gap:14px;padding:20px 28px 240px}
  .tile{break-inside:avoid;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;transition:box-shadow .2s;display:block;width:100%;text-align:left;font:inherit;color:inherit;padding:0}
  .tile:hover{box-shadow:0 2px 8px rgba(0,0,0,.04)}
  .tile .pic{position:relative;background:#F1F0EC;display:grid;place-items:center;color:var(--mute);font-size:12px;text-align:center}
  .tile .pic img{width:100%;display:block;filter:saturate(.8)}
  .tile .pic .tag{position:absolute;top:10px;left:10px}
  .shimmer{background:linear-gradient(90deg,#F1F0EC 0,#F8F7F4 50%,#F1F0EC 100%);background-size:200% 100%;animation:sh 1.6s linear infinite}
  @keyframes sh{to{background-position:-200% 0}}
  @media (prefers-reduced-motion:reduce){.shimmer{animation:none}}
  .tile .cap{padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
  .tile .cap p{margin:0;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .tile .cap .p{font-family:var(--mono);font-size:12px;text-align:right}
  .tile .cap .p small{display:block;color:var(--mute);font-size:10.5px}
  .failnote{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--red);background:var(--red-bg)}
  /* SIGNATURE: floating composer */
  .composer{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(880px,calc(100% - 32px));z-index:30;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.05)}
  .composer textarea{width:100%;border:0;resize:none;font:17px/1.45 var(--serif);color:var(--ink);padding:16px 18px 6px;min-height:58px;max-height:180px;background:transparent}
  .composer textarea:focus{outline:none}
  .crow{display:flex;gap:8px;align-items:center;padding:8px 12px 12px;flex-wrap:wrap}
  .crow .spacer{flex:1}
  .count{font:11px var(--mono);color:var(--mute)}
  .pop{position:absolute;bottom:calc(100% + 10px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.06);min-width:240px}
  .pop .opt{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
  .pop .opt[aria-pressed=true]{background:#F7F6F3}
  .pop .opt small{color:var(--mute);font-family:var(--mono)}
  .pop input{width:100%;font:12px var(--mono);border:0;border-bottom:1px solid var(--line);padding:7px 0;margin-bottom:4px}
  .pricechip{font-family:var(--mono)}
  .pricechip.over{background:var(--red-bg);color:var(--red);border-color:#F3CFD2}
  .receipt{right:0;width:340px}
  .rline{display:grid;grid-template-columns:1fr auto;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rline small{display:block;color:var(--mute);font:11px var(--mono)}
  .rline .v{font-family:var(--mono);font-size:12.5px}
  .rtotal{font-family:var(--serif);font-size:28px;letter-spacing:-.02em;line-height:1.1}
  .lowmsg{font-size:12px;color:var(--red);padding:0 18px 10px}
  .lab{position:fixed;left:16px;bottom:16px;font-size:11px;color:var(--mute);display:flex;gap:6px;align-items:center;z-index:31;background:var(--bg);padding:4px 8px;border:1px solid var(--line);border-radius:6px}
  /* side panel */
  .scrim{position:fixed;inset:0;background:rgba(47,52,55,.18);z-index:40}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);border-left:1px solid var(--line);z-index:41;overflow:auto;padding:24px}
  .panel img{width:100%;border-radius:8px;border:1px solid var(--line)}
  .panel h2{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.02em;line-height:1.25;margin:16px 0 6px}
  .meta{font-size:12px;color:var(--mute)}
  .track{height:4px;background:#F1F0EC;border-radius:2px;position:relative;margin:14px 0 6px}
  .track i{position:absolute;top:-3px;width:2px;height:10px;background:var(--ink)}
  .ends{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mute)}
  .close{position:absolute;top:14px;right:14px}
  .stack{display:grid;gap:4px;margin-top:20px}
  .note{font-size:12px;color:var(--mute);margin-top:4px}
  /* credits + admin pages, same shell and full width as the feed */
  .page{padding:40px 28px 120px}
  .page .head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
  h2{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.02em;margin:0 0 14px}
  .pad{padding:28px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .bento{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
  .huge{font-family:var(--serif);font-size:60px;letter-spacing:-.04em;line-height:1}
  .lbl{font-size:12px;color:var(--mute);margin-bottom:8px}
  .lines{margin-top:24px;border-top:1px solid var(--line)}
  .line{display:grid;grid-template-columns:1fr auto;padding:11px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line small{display:block;color:var(--mute);font:11px var(--mono)}
  .line .v{font-family:var(--mono);font-size:13px;text-align:right}
  .pk{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .pk:last-of-type{border:0}
  .pk b{font-family:var(--serif);font-weight:400;font-size:24px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:11px 14px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .n{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
  .section{margin-top:48px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .stat{padding:20px}.stat .v{font-family:var(--serif);font-size:30px;letter-spacing:-.03em}
  .controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:13px;color:var(--mute)}
  .controls input{font:inherit;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
  .tablewrap{overflow:auto}
  .tablewrap table{min-width:820px}
  .tablewrap table.fit{min-width:0}
  td.tags{white-space:nowrap}
  td.tags .tag{vertical-align:middle}
  td.tags .tag + .tag{margin-left:6px}
  /* layout variants for Credits / Admin */
  .page{padding:36px 28px 120px}
  .titlerow{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:6px}
  .titlerow h1{font-size:36px}
  .cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .cardhead .lbl{margin:0}
  a.chip{text-decoration:none}
  .ends{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--mute);margin-top:4px}
  .packrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .packbtn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}
  .packbtn:hover{border-color:#CFCDC8;background:#F7F6F3}
  .packbtn b{font-family:var(--serif);font-weight:400;font-size:26px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .l-side,.l-col,.l-split{display:flex;flex-direction:column;gap:14px}
  .l-side{display:grid;grid-template-columns:220px minmax(0,1040px);justify-content:center;gap:40px;align-items:start}
  .l-side .col,.l-split .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .subnav{position:sticky;top:84px;display:flex;flex-direction:column;gap:2px}
  .subnav a{color:var(--mute);text-decoration:none;padding:8px 10px;border-radius:6px}
  .subnav a[aria-current]{background:#F1F0EC;color:var(--ink)}
  .l-col{max-width:1040px;margin:0 auto}
  .l-col.narrow{max-width:680px}
  .l-split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;max-width:1240px;margin:0 auto;align-items:start}
  .l-split .sticky{position:sticky;top:84px;display:flex;flex-direction:column;gap:14px}
  .l-split .stats,.l-side .stats{margin:0}
  .seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;background:#fff}
  .seg2 button{font:inherit;border:0;background:none;padding:8px 14px;cursor:pointer;color:var(--mute);border-right:1px solid var(--line)}
  .seg2 button:last-child{border:0}.seg2 button[aria-pressed=true]{background:#F1F0EC;color:var(--ink)}
  .layoutswitch{position:fixed;left:16px;bottom:16px;z-index:31;background:var(--ink);color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;display:flex;gap:4px;align-items:center}
  .layoutswitch[hidden]{display:none}
  .layoutswitch button{font:inherit;border:0;border-radius:5px;padding:5px 9px;background:transparent;color:#CFCDC8;cursor:pointer}
  .layoutswitch button[aria-pressed=true]{background:#fff;color:var(--ink)}
  @media (max-width:1000px){.l-side,.l-split{grid-template-columns:1fr}.subnav,.l-split .sticky{position:static}.subnav{flex-direction:row;overflow:auto}.grid2,.packrow{grid-template-columns:1fr}}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
  .pg{display:flex;gap:10px;align-items:center}
  .chip[disabled]{opacity:.45;cursor:not-allowed}
  @media (max-width:900px){.bento,.stats{grid-template-columns:1fr}.page .head{flex-direction:column;align-items:start}}
  @media (max-width:720px){.intro{flex-direction:column;align-items:start}.feed{columns:2 150px;padding:12px 12px 260px}.bar{padding:10px 14px;gap:12px}nav{display:none}.receipt{width:calc(100vw - 32px)}}
  /* ---- additions: missing UI states ---- */
  .sr{position:absolute;left:-9999px}
  .chip[aria-pressed=true]{background:#F1F0EC}
  .chip.bad{border-color:#F3CFD2;color:var(--red)}
  .count.over{color:var(--red);font-weight:600}
  .refrow{display:flex;gap:6px}
  .pop input[aria-invalid=true]{border-bottom-color:var(--red);color:var(--red)}
  .fielderr{font-size:11.5px;color:var(--red);margin:-2px 0 6px}
  .more{display:flex;gap:14px;align-items:center;justify-content:center;padding:0 28px 240px;margin-top:-210px}
  .feed.is-empty{columns:auto;display:flex;justify-content:center}
  .empty{padding:40px;text-align:center;max-width:640px;margin:20px auto}
  .empty h2{font-family:var(--serif);font-weight:400;font-size:30px;letter-spacing:-.02em;margin:0 0 8px}
  .empty.slim{display:flex;gap:14px;align-items:center;justify-content:center;padding:22px;column-span:all}
  .examples{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
  .tile.fresh{animation:pop .9s cubic-bezier(.16,1,.3,1);box-shadow:0 0 0 2px var(--blue-bg)}
  @keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.tile.fresh{animation:none}}
  .toasts{position:fixed;top:72px;right:20px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .toast{background:var(--btn);color:#fff;border-radius:8px;padding:10px 14px;font-size:13px;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.12);transition:opacity .3s,transform .3s}
  .toast.ok{background:#22412A}
  .toast.out{opacity:0;transform:translateY(-6px)}
  /* header: user menu + mobile menu */
  .usermenu{position:relative}
  .avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#F1F0EC;font:600 12px var(--sans);color:var(--ink);cursor:pointer}
  .menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:240px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.06);z-index:50}
  .menu .who{display:flex;flex-direction:column;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .menu a{display:block;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none}
  .menu a:hover{background:#F7F6F3}
  .menubtn{display:none}
  .mobilenav{display:flex;flex-direction:column;padding:6px 14px 12px;border-top:1px solid var(--line)}
  .mobilenav[hidden]{display:none}
  .mobilenav a{padding:10px 6px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .mobilenav a[aria-current]{font-weight:600}
  .mbal{padding:10px 6px;font-size:13px;color:var(--mute)}
  .mbal b{font-family:var(--mono);color:var(--ink);font-weight:500}
  .wallet .chip{text-decoration:none}
  /* admin drill-down + unreachable */
  .linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--blue);cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
  .linkbtn[disabled]{color:var(--mute);text-decoration:none;cursor:default}
  tr.sel td{background:#F7F6F3}
  .emptyrow{text-align:center;color:var(--mute);padding:28px}
  .warnstat{background:var(--yellow-bg);border-color:#F1E3B5}
  .emptychart{height:90px;display:grid;place-items:center;color:var(--mute);font-size:12.5px;background:#F7F6F3;border-radius:6px;text-align:center;padding:0 16px}
  .midsum{font-family:var(--serif);font-size:30px;letter-spacing:-.02em}
  .bigsum{font-family:var(--serif);font-size:32px;letter-spacing:-.02em}
  .freshrow td{background:var(--green-bg)}
  /* lab bar (not part of the app) */
  .labbar{position:fixed;left:16px;bottom:16px;z-index:31;background:#2F3437;color:#E7E6E2;border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px)}
  .labbar label{display:flex;gap:4px;align-items:center;cursor:pointer}
  .labbar .sep{width:1px;height:16px;background:#555}
  .labbar button{font:inherit;border:0;border-radius:5px;padding:4px 8px;background:transparent;color:#CFCDC8;cursor:pointer}
  .labbar button[aria-pressed=true]{background:#fff;color:var(--ink)}
  .composer{bottom:64px}
  @media (max-width:720px){.menubtn{display:inline-flex}.usermenu,.wallet{display:none}.bar .menubtn{margin-left:auto}.toasts{right:12px;left:12px;align-items:stretch}.more{margin-top:-230px}}
  /* loading skeletons: waiting (slow sweep), queued (sweep), processing (developing image) */
  .sk{position:relative;overflow:hidden;background:#ECEAE4;width:100%}
  .sk::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.7) 50%,transparent 75%);transform:translateX(-100%);animation:sweep 1.8s cubic-bezier(.4,0,.2,1) infinite}
  .sk-waiting{background:#EFEEEA}.sk-waiting::after{animation-duration:2.8s;opacity:.7}
  .sk-processing{background:#E9E5DD}
  .sk-blob{position:absolute;width:62%;aspect-ratio:1;border-radius:50%;filter:blur(30px);opacity:.85;will-change:transform}
  .sk-blob.b1{background:#E2CFB4;left:-10%;top:-15%;animation:drift1 7s ease-in-out infinite alternate}
  .sk-blob.b2{background:#C9D8E3;right:-15%;top:20%;animation:drift2 8s ease-in-out infinite alternate}
  .sk-blob.b3{background:#E3CAD3;left:20%;bottom:-25%;animation:drift3 9s ease-in-out infinite alternate}
  .sk-label{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:2;background:rgba(255,255,255,.82);backdrop-filter:blur(4px);border-radius:99px;padding:4px 11px;font-size:12px;color:var(--ink);white-space:nowrap;display:flex;gap:6px;align-items:center}
  .sk-label .t{font-family:var(--mono);color:var(--mute);font-size:11px}
  .dots{display:inline-flex;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.25;animation:dot 1.2s infinite}
  .dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
  @keyframes sweep{to{transform:translateX(100%)}}
  @keyframes drift1{to{transform:translate(28%,22%) scale(1.15)}}
  @keyframes drift2{to{transform:translate(-30%,-12%) scale(.9)}}
  @keyframes drift3{to{transform:translate(12%,-30%) scale(1.2)}}
  @keyframes dot{40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.sk::after,.sk-blob,.dots i{animation:none}.sk::after{display:none}}
</style>
</head>
<body>
<header><div class="bar"><span class="logo">Pixelforge</span>
  <nav id="nav"></nav>
  <span class="wallet"><a class="chip" href="#credits">Available <b id="avail"></b></a></span>
  <div class="usermenu"><button class="avatar" id="userBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Account menu"></button><div id="userMenu"></div></div>
  <button class="chip menubtn" id="menuBtn" aria-expanded="false" aria-controls="mobileNav">Menu</button>
</div><nav class="mobilenav" id="mobileNav" hidden></nav></header>

<div id="view-create">
  <section class="intro"><div><h1>Your images</h1><div class="meta">Newest first. Anything still running updates on its own.</div></div>
    <div class="filters" id="filters"></div></section>
  <main class="feed" id="feed"></main>
  <div class="more" id="more"></div>
  <div class="composer" id="composer"></div>
</div>
<main class="page" id="view-other" hidden></main>
<div class="labbar" id="labbar"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="panelRoot"></div>

<script src="../mock-data.js"></script>
<script>
const L=window.LAB;
const m=(n,d)=>`<span class="money" title="${L.exact(n)}">${L.cents(n,d)}</span>`;
const TAG={waiting:["Waiting for a slot","t-gray"],queued:["Queued","t-blue"],processing:["Processing","t-yellow"],succeeded:["Done","t-green"],failed:["Failed","t-red"]};
const SIZES=[["1024x1024","Square","1:1"],["1536x1024","Landscape","3:2"],["1024x1536","Portrait","2:3"]];
const ratio=s=>{const [w,h]=s.split("x").map(Number);return h/w};
const live=g=>["waiting","queued","processing"].includes(g.status);
const S={prompt:"A lighthouse on a cliff at dawn, oil painting",size:"1536x1024",quality:"high",refs:["https://example.com/style.png"],
  open:null,filter:"all",sel:null,page:"create",layout:+(new URLSearchParams(location.search).get("layout")||1),atab:"by-day",drill:null,shown:11,menu:false,user:false,fresh:null};
// Lab scenarios (not part of the app): flip states the real data can't easily show.
const SC={low:false,empty:false,unreach:false,nonadmin:false,many:true};

/* ---------- mutable demo state ---------- */
const W={gens:[...L.generations],ledger:[...L.ledger],balance:L.balance};
const gens=()=>SC.empty?W.gens.filter(g=>g.mine):W.gens;
const ledger=()=>SC.empty?W.ledger.filter(e=>e.reason==="Sign-up bonus"||e.mine):W.ledger;
const balance=()=>SC.empty?5e9+W.ledger.filter(e=>e.mine).reduce((a,e)=>a+e.amount,0):W.balance;
const held=()=>gens().filter(live).reduce((a,g)=>a+g.estHigh,0);
const available=()=>SC.low?120_000_000:balance()-held();
const TOTAL=()=>SC.empty?gens().length:(SC.many?47:gens().length)+gens().filter(g=>g.mine).length;

/* ---------- toasts ---------- */
function toast(html,kind=""){
  const t=document.createElement("div");t.className="toast "+kind;t.innerHTML=html;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>t.classList.add("out"),3200);setTimeout(()=>t.remove(),3600);
}

/* ---------- header: nav, wallet, user menu, mobile menu ---------- */
function header(){
  const items=[["create","Create"],["credits","Credits"],...(SC.nonadmin?[]:[["admin","Admin report"]])];
  const links=items.map(([k,t])=>`<a href="#${k}" ${k===S.page?'aria-current="page"':""}>${t}</a>`).join("");
  document.getElementById("nav").innerHTML=links;
  const mn=document.getElementById("mobileNav");mn.innerHTML=`<div class="mbal">Available <b>${L.cents(available())}</b></div>`+links+`<a href="#" data-logout>Log out</a>`;mn.hidden=!S.menu;
  document.getElementById("menuBtn").setAttribute("aria-expanded",S.menu);
  const a=document.getElementById("avail");a.textContent=L.cents(available());a.title=L.exact(available());
  const u=SC.empty?{name:"Sam Okafor",email:"sam@example.com"}:L.user;
  const ub=document.getElementById("userBtn");ub.textContent=u.name.split(" ").map(x=>x[0]).join("");ub.setAttribute("aria-expanded",S.user);
  document.getElementById("userMenu").innerHTML=S.user?`<div class="menu" role="menu"><div class="who"><b>${u.name}</b><span class="meta">${u.email}</span>${SC.nonadmin?"":'<span class="tag t-blue" style="margin-top:6px;width:max-content">Admin</span>'}</div>
    <a role="menuitem" href="#credits">Credits · ${L.cents(available())} available</a>${SC.nonadmin?"":'<a role="menuitem" href="#admin">Admin report</a>'}<a role="menuitem" href="#" data-logout>Log out</a></div>`:"";
  document.querySelectorAll("[data-logout]").forEach(x=>x.onclick=e=>{e.preventDefault();S.user=false;S.menu=false;header();toast("Logged out (demo). In the app this returns you to the log-in page.")});
}
document.getElementById("userBtn").onclick=e=>{e.stopPropagation();S.user=!S.user;header()};
document.getElementById("menuBtn").onclick=()=>{S.menu=!S.menu;header()};
addEventListener("click",e=>{if(S.user&&!e.target.closest(".usermenu")){S.user=false;header()}});


const SKL={waiting:"Pixelforge busy, retrying",queued:"Starting soon",processing:"Drawing"};
function skeleton(g,style){
  const since=g.status==="processing"?(g.startedAt||g.createdAt):g.createdAt;
  return `<div class="sk sk-${g.status}" style="${style}">${g.status==="processing"?'<span class="sk-blob b1"></span><span class="sk-blob b2"></span><span class="sk-blob b3"></span>':""}
    <span class="sk-label">${SKL[g.status]}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="t" data-since="${since}"></span></span></div>`;
}
function tick(){document.querySelectorAll("[data-since]").forEach(el=>{const s=Math.max(0,Math.round((Date.now()-new Date(el.dataset.since))/1000));el.textContent=s<60?s+"s":Math.floor(s/60)+"m "+(s%60)+"s"})}
setInterval(tick,1000);
/* ---------- feed ---------- */
function filters(){
  const f=[["all","All"],["running","Running"],["succeeded","Done"],["failed","Failed"]];
  document.getElementById("filters").innerHTML=gens().length?f.map(([k,t])=>`<button class="chip" aria-pressed="${S.filter===k}" data-f="${k}">${t}</button>`).join(""):"";
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;feed();filters()});
}
function tile(g){
  const [t,c]=TAG[g.status];
  const h=g.status==="failed"?96:Math.round(260*ratio(g.size));
  const pic=g.status==="succeeded"&&g.image?`<img src="${g.image}" alt="${g.prompt}">`:live(g)?skeleton(g,`height:${h}px`):`<div style="height:${h}px;width:100%;display:grid;place-items:center;padding:16px">${g.status==="succeeded"?"Image expired":g.status==="failed"?"No image":g.status==="waiting"?"Pixelforge is busy. Retrying…":g.status==="queued"?"Queued at Pixelforge":"Drawing…"}</div>`;
  const price=g.status==="succeeded"?`${m(g.actual)}<small>${g.capped?"capped":"charged"}</small>`:g.status==="failed"?`$0.00<small>free</small>`:`≤ ${L.cents(g.estHigh,"up")}<small>max</small>`;
  return `<button class="tile ${S.fresh===g.id?"fresh":""}" data-id="${g.id}"><div class="pic">${pic}<span class="tag ${c}">${t}</span></div>
    <div class="cap"><p>${g.prompt}</p><div class="p">${price}</div></div>
    ${g.status==="failed"?`<div class="failnote">${L.ERRORS[g.error.code].title}</div>`:""}</button>`;
}
const EXAMPLES=["A lighthouse on a cliff at dawn, oil painting","Isometric tiny greenhouse full of succulents","Neon koi pond seen from above"];
function feed(){
  const all=gens(),list=all.filter(g=>S.filter==="all"||(S.filter==="running"?live(g):g.status===S.filter));
  const el=document.getElementById("feed"),more=document.getElementById("more");
  if(!all.length){
    el.classList.add("is-empty");
    el.innerHTML=`<div class="empty card"><h2>No images yet</h2><p class="meta">You have ${m(available())} to start with. Write a prompt below, or try one of these:</p>
      <div class="examples">${EXAMPLES.map(x=>`<button class="chip" data-ex="${x}">${x}</button>`).join("")}</div>
      <p class="meta" style="margin-top:18px">You'll see the price range before anything runs, and failed images are free.</p></div>`;
    document.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{S.prompt=b.dataset.ex;composer();document.getElementById("p").focus()});
    more.innerHTML="";return;
  }
  el.classList.remove("is-empty");
  if(!list.length){
    const msg={running:"Nothing running right now.",succeeded:"No finished images yet.",failed:"No failed images."}[S.filter];
    el.innerHTML=`<div class="empty card slim"><p style="margin:0">${msg}</p><button class="chip" data-f2="all">Show all</button></div>`;
    document.querySelector("[data-f2]").onclick=()=>{S.filter="all";filters();feed()};more.innerHTML="";return;
  }
  el.innerHTML=list.map(tile).join("");tick();
  document.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{S.sel=t.dataset.id;panel()});
  const total=S.filter==="all"?TOTAL():list.length, shown=Math.min(total,S.filter==="all"?S.shown:list.length);
  more.innerHTML=total>shown?`<button class="btn ghost" id="loadMore">Load 20 more</button><span class="meta">Showing ${shown} of ${total}</span>`:`<span class="meta">That's everything · ${total} image${total===1?"":"s"}</span>`;
  const lm=document.getElementById("loadMore");if(lm)lm.onclick=()=>{S.shown=Math.min(total,S.shown+20);toast(`Lab: would load images ${shown+1}–${S.shown} from the server`);feed()};
}

/* ---------- composer with validation ---------- */
const validUrl=u=>{try{const x=new URL(u);return x.protocol==="http:"||x.protocol==="https:"}catch{return false}};
function problems(){
  const out=[],chars=[...S.prompt].length;
  if(!S.prompt.trim()) out.push({k:"prompt",t:"Write a prompt to generate."});
  if(chars>4000) out.push({k:"prompt",t:`Prompt is ${chars-4000} characters over the 4,000 limit.`});
  S.refs.forEach((r,i)=>{if(r.trim()&&!validUrl(r.trim()))out.push({k:"refs",i,t:`Reference ${i+1} isn't a full web link. Use one starting with https://`})});
  return out;
}
function composer(){
  const refs=S.refs.filter(r=>r.trim()&&validUrl(r.trim()));
  const e=L.estimate(S.prompt.slice(0,4000)||" ",S.size,S.quality,refs.length);
  const errs=problems(),avail=available(),afford=avail>=e.highNano,ok=!errs.length&&afford;
  const up=n=>Math.ceil(n*1.25),dn=n=>Math.floor(n*1.25),sz=SIZES.find(s=>s[0]===S.size),chars=[...S.prompt].length;
  const badRef=i=>errs.some(x=>x.k==="refs"&&x.i===i);
  let pop="";
  if(S.open==="size") pop=`<div class="pop" style="left:12px">${SIZES.map(([v,t,r])=>`<button class="opt" data-size="${v}" aria-pressed="${S.size===v}">${t} <small>${r} · ${v}</small></button>`).join("")}</div>`;
  if(S.open==="quality") pop=`<div class="pop" style="left:140px">${["low","medium","high"].map(q=>`<button class="opt" data-q="${q}" aria-pressed="${S.quality===q}">${q[0].toUpperCase()+q.slice(1)}<small>${L.cents(up(L.PRICING.output[q][S.size]*40000))}+</small></button>`).join("")}<div class="note" style="padding:4px 10px">Higher quality draws more and thinks longer.</div></div>`;
  if(S.open==="refs") pop=`<div class="pop" style="left:250px;width:380px"><div class="meta" style="margin-bottom:6px">Reference image URLs · up to 4 · ${m(up(765*10000))} each</div>${S.refs.map((r,i)=>`<div class="refrow"><input data-ref="${i}" value="${r}" placeholder="https://" aria-invalid="${badRef(i)}" ${badRef(i)?`aria-describedby="referr${i}"`:""}><button class="chip" data-rm="${i}" aria-label="Remove reference ${i+1}">×</button></div>${badRef(i)?`<div class="fielderr" id="referr${i}">Use a full link starting with https://</div>`:""}`).join("")}${S.refs.length<4?'<button class="chip" id="add" style="margin-top:6px">Add URL</button>':'<div class="meta" style="margin-top:6px">That\'s the maximum of 4.</div>'}</div>`;
  if(S.open==="price") pop=`<div class="pop receipt"><div class="meta">Estimated price</div><div class="rtotal">${L.cents(e.lowNano,"down")} – ${L.cents(e.highNano,"up")}</div><div class="meta" style="margin-bottom:10px">Never more than ${m(e.highNano,"up")}. Charged only if it succeeds.</div>
    ${e.breakdown.map(b=>`<div class="rline"><div>${b.label}<small>${b.tokens} tokens · ${b.note}</small></div><div class="v">${b.low===b.high?L.cents(up(b.low)):L.cents(dn(b.low),"down")+"–"+L.cents(up(b.high),"up")}</div></div>`).join("")}
    <div class="rline" style="border:0"><div>Includes 25% service fee</div><div class="v"></div></div></div>`;
  const msg=errs.length&&S.prompt.trim()?`<div class="lowmsg">${errs[0].t}</div>`
    :!afford?`<div class="lowmsg">Not enough credits. ${L.cents(avail)} available, this could cost up to ${L.cents(e.highNano,"up")}. <a href="#credits" style="color:inherit">Buy credits</a></div>`:"";
  document.getElementById("composer").innerHTML=`
    <label for="p" class="sr">Prompt</label>
    <textarea id="p" rows="2" placeholder="Describe an image…" aria-invalid="${chars>4000}">${S.prompt}</textarea>
    ${msg}
    <div class="crow">
      <button class="chip" data-open="size" aria-expanded="${S.open==="size"}">${sz[1]} <small>${sz[2]}</small></button>
      <button class="chip" data-open="quality" aria-expanded="${S.open==="quality"}">${S.quality[0].toUpperCase()+S.quality.slice(1)} quality</button>
      <button class="chip ${errs.some(x=>x.k==="refs")?"bad":""}" data-open="refs" aria-expanded="${S.open==="refs"}">References <small>${S.refs.filter(Boolean).length}/4</small></button>
      <span class="spacer"></span><span class="count ${chars>4000?"over":""}">${chars.toLocaleString()}/4,000</span>
      <button class="chip pricechip ${afford?"":"over"}" data-open="price" aria-expanded="${S.open==="price"}" title="See how the price is worked out">${S.prompt.trim()?`${L.cents(e.lowNano,"down")}–${L.cents(e.highNano,"up")}`:"Price"}</button>
      <button class="btn" id="go" ${ok?"":"disabled"} ${ok?"":`title="${errs[0]?.t||"Not enough credits"}"`}>Generate</button>
    </div>${pop}`;
  const p=document.getElementById("p");
  p.oninput=()=>{S.prompt=p.value;const c=p.selectionStart;composer();const n=document.getElementById("p");n.focus();n.setSelectionRange(c,c)};
  p.onkeydown=ev=>{if(ev.key==="Enter"&&(ev.metaKey||ev.ctrlKey))document.getElementById("go").click()};
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.open=S.open===b.dataset.open?null:b.dataset.open;composer()});
  document.querySelectorAll("[data-size]").forEach(b=>b.onclick=()=>{S.size=b.dataset.size;S.open=null;composer()});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.quality=b.dataset.q;S.open=null;composer()});
  document.querySelectorAll("[data-ref]").forEach(i=>i.onchange=()=>{S.refs[+i.dataset.ref]=i.value;composer()});
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.refs.splice(+b.dataset.rm,1);composer()});
  const a=document.getElementById("add");if(a)a.onclick=()=>{S.refs.push("");composer();const ins=document.querySelectorAll("[data-ref]");ins[ins.length-1].focus()};
  document.getElementById("go").onclick=()=>{
    const g={id:"n"+Date.now(),mine:true,prompt:S.prompt.trim(),size:S.size,quality:S.quality,refs:[...refs],status:"waiting",estLow:e.lowNano,estHigh:e.highNano,createdAt:new Date().toISOString()};
    W.gens.unshift(g);S.fresh=g.id;S.shown++;S.filter="all";S.open=null;
    filters();feed();composer();header();scrollTo({top:0,behavior:"smooth"});
    toast(`Started. Up to <b>${L.cents(e.highNano,"up")}</b> set aside until it finishes.`);
  };
}

/* ---------- detail panel ---------- */
function panel(){
  const root=document.getElementById("panelRoot");
  if(!S.sel){root.innerHTML="";return}
  const g=W.gens.find(x=>x.id===S.sel),[t,c]=TAG[g.status],pos=L.rangePos(g);
  const img=g.status==="succeeded"&&g.image?`<img src="${g.image}" alt="${g.prompt}">`:live(g)?skeleton(g,`aspect-ratio:${1/ratio(g.size)};border-radius:8px`):`<div style="aspect-ratio:${1/ratio(g.size)};border-radius:8px;background:#F1F0EC;display:grid;place-items:center;color:var(--mute);padding:16px;text-align:center">${g.status==="succeeded"?"Image expired (Pixelforge keeps images 24 hours)":g.status==="failed"?"No image":"In progress"}</div>`;
  const cost=g.status==="succeeded"?`<div class="stack"><div class="meta">Charged</div><div class="bigsum">${m(g.actual)}</div>
      <div class="track"><i style="left:${Math.min(100,pos*100)}%"></i></div><div class="ends"><span>est. low ${L.cents(g.estLow,"down")}</span><span>max ${L.cents(g.estHigh,"up")}</span></div>
      ${g.capped?`<div class="note"><span class="tag t-red">capped</span> Pixelforge raised prices after you submitted. You paid the max you were shown.</div>`:`<div class="note">Landed ${Math.round(pos*100)}% of the way from the low estimate to the max.</div>`}</div>`
    :g.status==="failed"?`<div class="stack"><div class="meta">Charged</div><div class="bigsum">$0.00</div><div class="note" style="color:var(--red)"><b>${L.ERRORS[g.error.code].title}.</b> ${L.ERRORS[g.error.code].body}</div><div style="margin-top:12px"><button class="btn" data-retry>Try again</button></div></div>`
    :`<div class="stack"><div class="meta">Set aside until it finishes</div><div class="bigsum" style="color:var(--mute)">≤ ${m(g.estHigh,"up")}</div><div class="note">Estimate ${L.cents(g.estLow,"down")}–${L.cents(g.estHigh,"up")}. ${g.status==="waiting"?"Pixelforge is busy; we keep trying for up to 10 minutes.":""}</div></div>`;
  root.innerHTML=`<div class="scrim" id="scrim"></div><aside class="panel" role="dialog" aria-label="Image details"><button class="chip close" id="cl">Close</button>
    <span class="tag ${c}">${t}</span><div style="margin-top:14px">${img}</div><h2>${g.prompt}</h2>
    <div class="meta">${g.size} · ${g.quality} quality${g.refs.length?` · ${g.refs.length} reference${g.refs.length>1?"s":""}`:""} · ${new Date(g.createdAt).toLocaleString()}</div>${cost}
    ${g.status!=="failed"?`<div style="margin-top:24px"><button class="btn ghost" data-reuse>Use these settings</button></div>`:""}</aside>`;
  const close=()=>{S.sel=null;panel()};
  document.getElementById("scrim").onclick=document.getElementById("cl").onclick=close;
  const reuse=()=>{Object.assign(S,{prompt:g.prompt,size:g.size,quality:g.quality,refs:[...g.refs]});close();composer();document.getElementById("p").focus()};
  const r1=root.querySelector("[data-reuse]");if(r1)r1.onclick=()=>{reuse();toast("Settings copied into the prompt bar.")};
  const r2=root.querySelector("[data-retry]");if(r2)r2.onclick=()=>{reuse();toast("Settings copied. Press Generate to try again; the failed one stays free.")};
}
addEventListener("keydown",e=>{if(e.key==="Escape"){S.sel=null;S.open=null;S.user=false;S.menu=false;panel();composer();header()}});

/* ---------- pager ---------- */
function pager(total,noun,order,page=1,per=20){
  const pages=Math.max(1,Math.ceil(total/per)),from=total?(page-1)*per+1:0,to=Math.min(total,page*per);
  return `<div class="pager"><span>${order} · showing ${from}–${to} of ${total} ${noun}</span>
    <span class="pg"><button class="chip" ${page<=1?"disabled":""}>Previous</button><span>Page ${page} of ${pages}</span><button class="chip" ${page>=pages?"disabled":""}>Next</button></span></div>`;
}

/* ---------- Credits + Admin building blocks ---------- */
const SPEND=Array.from({length:30},(_,i)=>{const v=Math.max(0,Math.sin(i*.7)*.45+Math.cos(i*.31)*.3+.25);return i%9===4?0:Math.round(v*1e9*.6)});
function sparkline(data,w=520,h=90){
  const max=Math.max(...data,1),step=w/(data.length-1);
  const pts=data.map((v,i)=>`${(i*step).toFixed(1)},${(h-6-(v/max)*(h-16)).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" role="img" aria-label="Spending over the last 30 days"><polyline points="0,${h-6} ${pts} ${w},${h-6}" fill="#F4F3EF"/><polyline points="${pts}" fill="none" stroke="#2F3437" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
const d30=o=>new Date(Date.now()-o*864e5).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const DAYS=()=>SC.empty?L.days.map(d=>({...d,gens:0,charged:0,provider:0,pixelforge:0,profit:0,cappedCount:0,absorbed:0,estLow:0,estHigh:0})):L.days;
const USERS=()=>SC.empty?[]:L.users;
const SUCC=()=>W.gens.filter(g=>g.status==="succeeded");
function drillRows(){ // lab: fake a list for the chosen day/user by cycling the succeeded mocks
  if(SC.empty)return [];
  const base=SUCC(),n=!S.drill?base.length:S.drill.type==="day"?DAYS().find(d=>d.date===S.drill.v).gens:USERS().find(u=>u.email===S.drill.v).gens;
  return Array.from({length:Math.min(n,20)},(_,i)=>base[i%base.length]);
}
const blk={
  available:(topup=true)=>`<div class="card pad"><div class="cardhead"><span class="lbl">Credits</span>${topup?`<a class="chip" href="#credits" data-scroll="packs">Top up</a>`:""}</div>
    <div class="huge">${m(available())}</div><div class="meta">available to spend</div>
    <div class="lines"><div class="line"><div>Balance</div><div class="v">${m(balance())}</div></div>
    <div class="line"><div>Set aside for ${gens().filter(live).length} running<small>max price, released when they finish</small></div><div class="v">− ${m(held())}</div></div></div></div>`,
  spending:()=>{const data=SC.empty?SPEND.map(()=>0):SPEND,total=data.reduce((a,b)=>a+b,0);
    return `<div class="card pad"><div class="cardhead"><span class="lbl">Spending · last 30 days</span><a class="chip" href="#credits" data-scroll="ledger">See ledger</a></div>
    <div class="midsum">${m(total)}</div>${total?sparkline(data):`<div class="emptychart">Nothing spent yet. Charges show up here once an image succeeds.</div>`}
    <div class="ends"><span>${d30(29)}</span><span>${d30(15)}</span><span>${d30(0)}</span></div></div>`},
  packs:()=>`<div class="card pad" id="packs"><div class="lbl">Add credits</div>
    <div class="packrow">${L.packs.map(p=>`<button class="packbtn" data-buy="${p}"><b>$${p}</b><span class="meta">Add</span></button>`).join("")}</div>
    <div class="meta" style="margin-top:10px">No payment needed. This is a demo.</div></div>`,
  howto:()=>`<div class="card pad"><div class="lbl">How charging works</div><p class="meta" style="margin:0">You started with a $5.00 bonus. Each image is charged its exact price when it succeeds, never more than the max you saw. Failed images are free.</p></div>`,
  ledger:()=>{const rows=ledger();return `<div class="card" id="ledger"><div class="pad" style="padding-bottom:6px"><div class="lbl" style="margin:0">Ledger</div></div><div class="tablewrap"><table class="fit"><thead><tr><th>Date</th><th>Entry</th><th class="n">Amount</th></tr></thead><tbody>
    ${rows.map(e=>`<tr class="${e.fresh?"freshrow":""}"><td class="meta">${new Date(e.at).toLocaleDateString()}</td><td>${e.reason}${e.gen?`<div class="meta">${(W.gens.find(g=>g.id===e.gen)||{}).prompt||""}</div>`:""}</td><td class="n" title="${L.exact(e.amount)}" style="color:${e.amount>0?"var(--green)":"var(--ink)"}">${e.amount>0?"+":"−"}${L.cents(Math.abs(e.amount))}</td></tr>`).join("")}
    </tbody></table></div>${rows.length<=1?`<div class="pager"><span>Your sign-up bonus is the only entry so far. Purchases and image charges will appear here.</span></div>`:pager(rows.length,"entries","Newest first")}</div>`},
  stats:(cols=4)=>{const D=DAYS(),T=D.reduce((a,d)=>({c:a.c+d.charged,p:a.p+d.provider}),{c:0,p:0}),mis=D.filter(d=>d.provider!==d.pixelforge).length;
    const check=SC.unreach?`<div class="card stat warnstat"><div class="lbl">Matches Pixelforge</div><div class="v" style="font-size:20px">Couldn't check</div><div class="meta">Pixelforge's usage report didn't respond. Our own numbers are unaffected.</div><button class="chip" data-retrycheck style="margin-top:8px">Try again</button></div>`
      :`<div class="card stat"><div class="lbl">Matches Pixelforge</div><div class="v">${D.length-mis}/${D.length}</div><span class="tag ${mis?"t-yellow":"t-green"}">${mis?mis+" day off":"all match"}</span></div>`;
    return `<div class="stats" style="grid-template-columns:repeat(${cols},1fr)"><div class="card stat"><div class="lbl">Charged to users</div><div class="v">${L.cents(T.c)}</div></div><div class="card stat"><div class="lbl">Pixelforge cost</div><div class="v">${L.cents(T.p)}</div></div>
    <div class="card stat"><div class="lbl">Profit</div><div class="v">${L.cents(T.c-T.p)}</div></div>${check}</div>`},
  range:()=>`<div class="controls"><input type="date" value="${L.days.at(-1).date}" aria-label="From"> – <input type="date" value="${L.days[0].date}" aria-label="To"><span>max 92 days</span></div>`,
  days:()=>{const D=DAYS(),any=D.some(d=>d.gens);return `<div class="card" id="by-day"><div class="pad" style="padding-bottom:6px"><div class="lbl" style="margin:0">By day (UTC, by completion) · click a day to see its images</div></div><div class="tablewrap"><table><thead><tr><th>Day</th><th class="n">Images</th><th class="n">Charged</th><th class="n">Pixelforge cost</th><th class="n">Pixelforge reports</th><th class="n">Profit</th><th></th></tr></thead><tbody>
    ${any?D.map(d=>`<tr class="${S.drill&&S.drill.v===d.date?"sel":""}"><td><button class="linkbtn" data-dday="${d.date}" ${d.gens?"":"disabled"}>${d.date}</button></td><td class="n">${d.gens}</td><td class="n">${L.exact(d.charged)}</td><td class="n">${L.exact(d.provider)}</td><td class="n">${SC.unreach?'<span class="meta">—</span>':L.exact(d.pixelforge)}</td><td class="n">${L.exact(d.profit)}</td>
    <td class="tags">${SC.unreach?'<span class="tag t-gray">not checked</span>':d.provider===d.pixelforge?'<span class="tag t-green">match</span>':`<span class="tag t-yellow" title="Off by ${L.exact(d.pixelforge-d.provider)}">mismatch</span>`}${d.cappedCount?`<span class="tag t-red" title="${L.exact(d.absorbed)} absorbed">${d.cappedCount} capped</span>`:""}</td></tr>`).join("")
    :`<tr><td colspan="7" class="emptyrow">No images finished between ${L.days.at(-1).date} and ${L.days[0].date}. Pick a wider range or check back after users generate.</td></tr>`}
    </tbody></table></div></div>`},
  users:()=>{const U=USERS();return `<div class="card" id="by-user"><div class="pad" style="padding-bottom:6px"><div class="lbl" style="margin:0">By user · click a user to see their images</div></div><div class="tablewrap"><table><thead><tr><th>User</th><th class="n">Images</th><th class="n">Charged</th><th class="n">Pixelforge cost</th><th class="n">Profit</th><th class="n">Estimated</th><th></th></tr></thead><tbody>
    ${U.length?U.map(u=>`<tr class="${S.drill&&S.drill.v===u.email?"sel":""}"><td><button class="linkbtn" data-duser="${u.email}">${u.name}</button><div class="meta">${u.email}</div></td><td class="n">${u.gens}</td><td class="n">${L.exact(u.charged)}</td><td class="n">${L.exact(u.provider)}</td><td class="n">${L.exact(u.profit)}</td><td class="n">${L.cents(u.estLow,"down")}–${L.cents(u.estHigh,"up")}</td><td class="tags">${u.cappedCount?`<span class="tag t-red">${u.cappedCount} capped</span>`:""}</td></tr>`).join("")
    :`<tr><td colspan="7" class="emptyrow">No users generated images in this range.</td></tr>`}
    </tbody></table></div>${U.length?pager(U.length,"users","Highest charged first"):""}</div>`},
  images:()=>{const rows=drillRows(),d=S.drill;
    const title=!d?"All images in range":d.type==="day"?`Images that finished on ${d.v}`:`Images by ${USERS().find(u=>u.email===d.v).name}`;
    const total=!d?rows.length:d.type==="day"?DAYS().find(x=>x.date===d.v).gens:USERS().find(u=>u.email===d.v).gens;
    return `<div class="card" id="by-image"><div class="pad cardhead" style="padding-bottom:6px;margin:0"><div class="lbl" style="margin:0">${title}</div>${d?'<button class="chip" data-clear>Show all</button>':""}</div><div class="tablewrap"><table><thead><tr><th>Prompt</th>${d&&d.type==="day"?"<th>User</th>":""}<th class="n">Estimate</th><th style="width:160px">Landed at</th><th class="n">Charged</th><th class="n">Pixelforge cost</th></tr></thead><tbody>
    ${rows.length?rows.map((g,i)=>`<tr><td>${g.prompt}${g.capped?' <span class="tag t-red">capped</span>':""}</td>${d&&d.type==="day"?`<td class="meta">${USERS()[i%USERS().length].name}</td>`:""}<td class="n">${L.cents(g.estLow,"down")}–${L.cents(g.estHigh,"up")}</td><td><div class="track"><i style="left:${Math.min(100,L.rangePos(g)*100)}%"></i></div><span class="meta">${Math.round(Math.min(1,L.rangePos(g))*100)}% of range</span></td><td class="n">${L.exact(g.actual)}</td><td class="n">${L.exact(g.provider)}</td></tr>`).join("")
    :`<tr><td colspan="6" class="emptyrow">No images to show.</td></tr>`}
    </tbody></table></div>${rows.length?pager(total,"images","Newest first"):""}</div>`},
};

/* Layouts for Credits / Admin (1 Sidebar is the preferred one) */
function sidebarShell(items,content){
  return `<div class="l-side"><aside class="subnav">${items.map(([id,t],i)=>`<a href="#${S.page}" data-scroll="${id}" ${i===0?'aria-current="true"':""}>${t}</a>`).join("")}</aside><div class="col">${content}</div></div>`;
}
const credits1=()=>sidebarShell([["top","Overview"],["packs","Add credits"],["ledger","Ledger"]],`<div id="top" class="titlerow"><h1>Credits</h1></div><div class="grid2">${blk.available()}${blk.spending()}</div>${blk.packs()}${blk.ledger()}`);
const admin1=()=>sidebarShell([["top","Overview"],["by-day","By day"],["by-user","By user"],["by-image","Images"]],`<div id="top" class="titlerow"><div><h1>Admin report</h1><div class="meta">Only admins see this page.</div></div>${blk.range()}</div>${blk.stats(4)}${blk.days()}${blk.users()}${blk.images()}`);
const credits2=()=>`<div class="l-col narrow"><div class="titlerow"><h1>Credits</h1></div>${blk.available()}${blk.packs()}${blk.spending()}${blk.ledger()}</div>`;
const admin2=()=>`<div class="l-col"><div class="titlerow"><div><h1>Admin report</h1><div class="meta">Only admins see this page.</div></div>${blk.range()}</div>${blk.stats(4)}
  <div class="seg2">${[["by-day","By day"],["by-user","By user"],["by-image","Images"]].map(([k,x])=>`<button data-atab="${k}" aria-pressed="${S.atab===k}">${x}</button>`).join("")}</div>${S.atab==="by-day"?blk.days():S.atab==="by-user"?blk.users():blk.images()}</div>`;
const credits3=()=>`<div class="l-split"><div class="sticky">${blk.available(false)}${blk.packs()}${blk.howto()}</div><div class="col">${blk.spending()}${blk.ledger()}</div></div>`;
const admin3=()=>`<div class="l-split"><div class="sticky"><div class="card pad"><h1 style="font-size:28px">Admin report</h1><div class="meta" style="margin-bottom:12px">Only admins see this page.</div>${blk.range()}</div>${blk.stats(1)}</div><div class="col">${blk.days()}${blk.users()}${blk.images()}</div></div>`;
const VARIANTS={credits:[credits1,credits2,credits3],admin:[admin1,admin2,admin3]};
const forbidden=()=>`<div class="l-col narrow"><div class="card pad empty" style="margin-top:40px"><h2>Admins only</h2><p class="meta">This report shows every user's spending, so it's limited to operators. If you need access, ask an admin to run the make-admin command for your account.</p><a class="btn" href="#create" style="text-decoration:none;width:max-content">Back to your images</a></div></div>`;

/* ---------- lab bar ---------- */
function labbar(){
  const states=[["low","Low balance"],["empty","New user"],["nonadmin","Not an admin"],["unreach","Report: Pixelforge check fails"]];
  const lay=S.page==="create"?"":`<span class="sep"></span>Layout ${["Sidebar","Column","Split"].map((t,i)=>`<button aria-pressed="${S.layout===i+1}" data-layout="${i+1}">${t}</button>`).join("")}`;
  document.getElementById("labbar").innerHTML=`<b>Lab</b>${states.map(([k,t])=>`<label><input type="checkbox" data-sc="${k}" ${SC[k]?"checked":""}> ${t}</label>`).join("")}${lay}`;
  document.querySelectorAll("[data-sc]").forEach(c=>c.onchange=()=>{SC[c.dataset.sc]=c.checked;S.shown=11;S.drill=null;renderAll();if(c.dataset.sc==="unreach"&&c.checked&&S.page!=="admin")toast('This only changes the Admin report. <a href="#admin" style="color:#fff">Open it</a>')});
  document.querySelectorAll("[data-layout]").forEach(b=>b.onclick=()=>{S.layout=+b.dataset.layout;const u=new URL(location);u.searchParams.set("layout",S.layout);history.replaceState(null,"",u);route()});
}

/* ---------- routing ---------- */
function route(){
  S.page=["credits","admin"].includes(location.hash.slice(1))?location.hash.slice(1):"create";S.menu=false;
  header();labbar();
  document.getElementById("view-create").hidden=S.page!=="create";
  const other=document.getElementById("view-other");other.hidden=S.page==="create";
  if(S.page==="create"){filters();feed();composer();return}
  other.innerHTML=S.page==="admin"&&SC.nonadmin?forbidden():VARIANTS[S.page][S.layout-1]();
  bindOther();S.sel=null;panel();
}
function bindOther(){
  document.querySelectorAll("[data-atab]").forEach(b=>b.onclick=()=>{S.atab=b.dataset.atab;route()});
  document.querySelectorAll("[data-scroll]").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.scroll);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:"smooth"});document.querySelectorAll(".subnav a").forEach(x=>x.toggleAttribute("aria-current",x===a))});
  document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{
    const amt=+b.dataset.buy*1e9;W.balance+=amt;W.ledger.forEach(x=>x.fresh=false);W.ledger.unshift({at:new Date().toISOString(),reason:`Bought $${b.dataset.buy} credit pack`,amount:amt,mine:true,fresh:true});
    route();toast(`Added <b>$${b.dataset.buy}.00</b>. You now have ${L.cents(available())} available.`,"ok")});
  const drill=(type,v)=>{S.drill={type,v};if(S.layout===2)S.atab="by-image";route();const el=document.getElementById("by-image");if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-80,behavior:"smooth"})};
  document.querySelectorAll("[data-dday]").forEach(b=>b.onclick=()=>drill("day",b.dataset.dday));
  document.querySelectorAll("[data-duser]").forEach(b=>b.onclick=()=>drill("user",b.dataset.duser));
  const cl=document.querySelector("[data-clear]");if(cl)cl.onclick=()=>{S.drill=null;route()};
  const rc=document.querySelector("[data-retrycheck]");if(rc)rc.onclick=()=>toast("Lab: would ask Pixelforge for usage again.");
}
function renderAll(){route()}
addEventListener("hashchange",()=>{route();scrollTo(0,0)});
route();
</script>
</body>
</html>
